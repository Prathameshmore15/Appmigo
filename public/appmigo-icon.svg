<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <clipPath id="ic-clip">
      <rect x="6" y="6" width="108" height="108" rx="28" />
    </clipPath>
  </defs>
  
  <!-- Shadow -->
  <rect x="10" y="12" width="108" height="108" rx="28" fill="rgba(0,0,0,0.06)" />
  
  <!-- Rounded square -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="white" stroke="#059669" stroke-width="2" />
  
  <!-- A monogram -->
  <g clip-path="url(#ic-clip)">
    <!-- Left stroke -->
    <polygon points="56,22 24,95 42,95 60,30" fill="#059669" />
    <!-- Right stroke -->
    <polygon points="64,22 78,95 96,95 60,30" fill="#059669" />
    <!-- Crossbar (gold) -->
    <rect x="36" y="60" width="48" height="10" rx="3" fill="#B8860B" />
    <!-- Play triangle -->
    <polygon points="56,30 56,46 69,38" fill="#B8860B" />
  </g>
</svg>
